<!DOCTYPE html>
<html lang="th" data-lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doi Tung | สินค้าคุณภาพจากขุนเขา</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav style="padding: 1.5rem 10%;">
        <a href="index.html" class="logo">Doi Tung</a>
        <ul class="nav-links">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="products.html" data-i18n="nav_products">Products</a></li>
            <li><a href="contact.html" data-i18n="nav_contact">Contact</a></li>
        </ul>
        <div class="nav-right">
            <button id="lang-toggle">EN</button>
        </div>
    </nav>

    <header style="padding: 150px 10% 50px; text-align: center; background: var(--primary); color: var(--white);">
        <h1 class="reveal" data-i18n="products_header">Our Products</h1>
    </header>

    <section class="products-section">
        <aside class="sidebar">
            <h3 data-i18n="sidebar_title">Browse by Factory</h3>
            <ul id="factory-filters" class="filter-list">
                <li class="filter-item active" data-factory="all" data-i18n="all">All Products</li>
                <!-- Factory filters will be injected here -->
            </ul>
        </aside>

        <div id="product-grid" class="product-grid">
            <!-- Products will be dynamically injected here via scripts.js -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Doi Tung. <span data-i18n="footer_rights">All Rights Reserved.</span></p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
